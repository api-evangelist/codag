aid: codag
name: Codag
description: >-
  Codag is a Y Combinator (Summer 2026) developer-tools company building drop-in
  log compression for AI agents. It takes oversized infrastructure logs — from
  Kubernetes, Docker, AWS CloudWatch, Vercel, Railway, Datadog, Sentry, syslog and
  unstructured sources — and returns only the lines that matter as schema-valid
  JSON, ranked into patterns where every kept line cites a real log line number so
  nothing is summarized away or invented. This lets coding agents like Claude,
  Codex and Cursor debug from the evidence that matters at roughly 95% fewer tokens
  without exhausting their context window. Codag ships as a hosted HTTPS API
  (/v1/compact), an open-source Go CLI, and an MCP server, with a deterministic
  Rust log-templating engine (codag-drain) as the free/fallback path.
