openapi: 3.1.0
info:
  title: infra-logs templater Activate API
  description: Token compression for log streams. POST raw logs, get back templates or capsules.
  version: 0.1.0
tags:
- name: Activate
paths:
  /api/activate/{code}:
    get:
      summary: Preview Activation Code
      description: 'Public (unauthenticated) preview so the landing page can show what the

        link grants *before* Google sign-in. Reveals kind, trial/opt-out length,

        validity, and the label (prospect-facing copy on the deal card) — never

        redemption internals. Rate-limited: this is a code-validity oracle. The

        slowapi decorator buckets per path (per guessed code), so unknown-code

        lookups additionally burn a cross-path per-IP budget.'
      operationId: preview_activation_code_api_activate__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Preview Activation Code Api Activate  Code  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Activate
  /api/activate/{code}/redeem:
    post:
      summary: Redeem Activation Code
      description: 'Redeem an activation code: grant the caller''s org a time-boxed inference

        trial. Idempotent per (code, org) — re-clicking neither double-counts nor

        re-extends.'
      operationId: redeem_activation_code_api_activate__code__redeem_post
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RedeemActivationRequest'
              - type: 'null'
              title: Req
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Redeem Activation Code Api Activate  Code  Redeem Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Activate
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RedeemActivationRequest:
      properties:
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
      type: object
      title: RedeemActivationRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
