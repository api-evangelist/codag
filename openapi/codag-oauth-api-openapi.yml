openapi: 3.1.0
info:
  title: infra-logs templater Activate Oauth API
  description: Token compression for log streams. POST raw logs, get back templates or capsules.
  version: 0.1.0
tags:
- name: Oauth
paths:
  /oauth/device/code:
    post:
      summary: Device Code Endpoint
      description: Issue a fresh device + user code pair. No authentication.
      operationId: device_code_endpoint_oauth_device_code_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_device_code_endpoint_oauth_device_code_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Oauth
  /oauth/token:
    post:
      summary: Token Endpoint
      description: Exchange a device_code or refresh_token for a fresh access token.
      operationId: token_endpoint_oauth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_token_endpoint_oauth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Oauth
components:
  schemas:
    Body_token_endpoint_oauth_token_post:
      properties:
        grant_type:
          type: string
          title: Grant Type
        device_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Code
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
        client_id:
          type: string
          title: Client Id
          default: codag-cli
      type: object
      required:
      - grant_type
      title: Body_token_endpoint_oauth_token_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_device_code_endpoint_oauth_device_code_post:
      properties:
        client_id:
          type: string
          title: Client Id
          default: codag-cli
        scope:
          type: string
          title: Scope
          default: ''
        anonymous_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Anonymous Token
      type: object
      title: Body_device_code_endpoint_oauth_device_code_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
